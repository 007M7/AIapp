name: iOS 未签名 IPA

on:
  workflow_dispatch:
    inputs:
      note:
        description: 本次构建的说明
        required: false
        default: mvp1
      configuration:
        description: 构建配置，Debug为设备试用版
        type: choice
        options: [Debug, Release]
        default: Debug

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: 工具链自检
        run: xcodebuild -version
      - name: 安装 XcodeGen
        run: brew install xcodegen
      - name: 生成工程、自测与未签名编译
        env:
          BUILD_CONFIGURATION: ${{ inputs.configuration || 'Release' }}
        run: CODE_SIGNING_ALLOWED=NO bash ios/tools/build-ipa.sh
      - name: 构建模拟器与原生界面截图
        if: inputs.configuration == 'Debug'
        run: bash ios/tools/preview-simulator.sh
      - name: 保存原生界面预览
        if: inputs.configuration == 'Debug'
        uses: actions/upload-artifact@v4
        with:
          name: AIFigure-native-preview
          path: ios/preview/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: AIFigure-unsigned-${{ github.event.inputs.note || 'mvp1' }}
          path: |
            ios/dist/AIFigure-unsigned.ipa
            ios/dist/build-metadata.txt
          if-no-files-found: error
          retention-days: 30
      - name: 保存编译日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AIFigure-build-log-${{ github.run_id }}
          path: ios/build.log
          if-no-files-found: ignore
          retention-days: 14
