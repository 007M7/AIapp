name: Management checks
on:
  push:
    paths: ['admin/**', 'docs/admin/**', '.github/workflows/admin-checks.yml']
  pull_request:
    paths: ['admin/**', 'docs/admin/**', '.github/workflows/admin-checks.yml']
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: admin/frontend/package-lock.json
      - run: python -m pip install -r admin/requirements-lock.txt
      - run: npm --prefix admin/frontend ci
      - run: npm --prefix admin/frontend run build
      - run: python -m unittest discover -s admin/tests -v
