name: AIFigure

# 与 jev 项目(D:\jev)同一范式:不提交 .xcodeproj,由 XcodeGen 从本文件生成。
# 原因:.xcodeproj 冲突极难解决;云构建上 `xcodegen generate` 只要几秒;
# 本地没有 Mac 时不需要装 XcodeGen,GitHub Actions 的 macOS runner 会装。
options:
  bundleIdPrefix: com.aiapp
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGNING_ALLOWED: "NO"      # 产出未签名 IPA,由 Windows 侧 Sideloadly 用个人 Apple ID 重签(免费 7 天)
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGN_IDENTITY: ""
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  AIFigure:
    type: application
    platform: iOS
    sources:
      - path: AIFigure               # 整个源码目录自动入工程;Info.plist 会被自动排除,Assets.xcassets 自动进资源
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aiapp.figure   # 占位;Sideloadly 免费签会自动加后缀
        INFOPLIST_FILE: AIFigure/Info.plist
        TARGETED_DEVICE_FAMILY: "1"  # 只做 iPhone(PRD §3.1 App 列)
        ENABLE_PREVIEWS: "YES"
